<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y glow sutil -->
    <filter id="cora-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#800038" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="cora-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3898" />
      <stop offset="100%" stop-color="#D6086B" />
    </linearGradient>
    <linearGradient id="cora-lever-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF52A5" />
      <stop offset="100%" stop-color="#BD005C" />
    </linearGradient>
    <linearGradient id="facet-hl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g id="heart-grenade" filter="url(#cora-glow)">
    <!-- 1. MECANISMO DE DISPARO SUPERIOR (FUZE ASSEMBLY) -->
    
    <!-- Palanca de Seguridad (Spoon / Safety Lever) lado derecho -->
    <path d="M 320 64 
             C 335 64, 345 74, 350 90 
             L 375 160 
             C 388 195, 396 230, 392 265 
             C 389 278, 381 284, 372 284 
             C 362 284, 358 274, 362 258 
             C 367 230, 359 198, 348 168 
             L 332 118 
             C 328 106, 320 98, 308 94 
             Z" 
          fill="url(#cora-lever-grad)" 
          stroke="#940043" 
          stroke-width="10" 
          stroke-linejoin="round" />

    <!-- Bloque central del detonador / fuze neck -->
    <path d="M 218 66 
             C 218 52, 228 42, 242 42 
             L 326 42 
             C 338 42, 348 52, 348 66 
             L 344 140 
             C 300 135, 260 148, 222 170 
             Z" 
          fill="url(#cora-base-grad)" 
          stroke="#940043" 
          stroke-width="10" 
          stroke-linejoin="round" />
    
    <!-- Detalles internos del detonador (estrías y ranuras técnicas) -->
    <rect x="238" y="52" width="88" height="24" rx="4" fill="#FFA5D2" stroke="#940043" stroke-width="7" />
    <path d="M 246 88 L 322 88 M 246 104 L 320 104" stroke="#940043" stroke-width="6" stroke-linecap="round" />

    <!-- Pin de seguridad (cotter pin) en el lado izquierdo -->
    <circle cx="210" cy="72" r="16" fill="#FFA5D2" stroke="#940043" stroke-width="9" />
    <circle cx="206" cy="68" r="4.5" fill="#FFFFFF" />

    <!-- Anilla de tracción (Pull Ring) en el lado derecho -->
    <circle cx="316" cy="140" r="50" fill="none" stroke="#940043" stroke-width="15" />
    <circle cx="316" cy="140" r="49" fill="none" stroke="#FF52A5" stroke-width="8" />
    <path d="M 292 110 A 38 38 0 0 1 350 125" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <!-- Eslabón de sujeción de anilla -->
    <circle cx="316" cy="90" r="10" fill="#FFA5D2" stroke="#940043" stroke-width="6" />

    <!-- 2. SILUETA BASE DEL CORAZÓN (CUERPO DE LA GRANADA) -->
    <path id="heart-base" 
          d="M 256 182 
             C 210 142, 132 142, 94 198 
             C 58 250, 68 322, 126 384 
             C 166 426, 214 460, 256 484 
             C 298 460, 346 426, 386 384 
             C 444 322, 454 250, 418 198 
             C 380 142, 302 142, 256 182 
             Z" 
          fill="url(#cora-base-grad)" 
          stroke="#940043" 
          stroke-width="14" 
          stroke-linejoin="round" />

    <!-- 3. FACETAS DE FRAGMENTACIÓN DE LA GRANADA (SEGMENTED BLOCKS) -->
    
    <!-- Bloques Lóbulo Superior Izquierdo -->
    <path d="M 246 195 C 205 168, 150 170, 118 210 C 138 238, 185 240, 246 228 Z" fill="#EA1679" stroke="#940043" stroke-width="8" />
    <path d="M 124 212 C 145 186, 195 180, 235 198" fill="none" stroke="url(#facet-hl)" stroke-width="6" stroke-linecap="round" />

    <!-- Bloques Lóbulo Superior Derecho -->
    <path d="M 266 195 C 307 168, 362 170, 394 210 C 374 238, 327 240, 266 228 Z" fill="#EA1679" stroke="#940043" stroke-width="8" />
    <path d="M 280 200 C 320 182, 368 188, 386 212" fill="none" stroke="url(#facet-hl)" stroke-width="6" stroke-linecap="round" />

    <!-- Fila 2: Cuadrantes Superiores Medios Izquierda -->
    <path d="M 112 224 C 84 260, 84 296, 102 328 C 150 326, 198 316, 246 302 L 246 240 C 188 252, 142 248, 112 224 Z" fill="#E61073" stroke="#940043" stroke-width="8" />
    <path d="M 118 238 C 146 256, 192 258, 240 248" fill="none" stroke="url(#facet-hl)" stroke-width="6" stroke-linecap="round" />
    <path d="M 100 248 C 94 274, 98 296, 110 316" fill="none" stroke="url(#facet-hl)" stroke-width="5" stroke-linecap="round" />

    <!-- Fila 2: Cuadrantes Superiores Medios Derecha -->
    <path d="M 400 224 C 428 260, 428 296, 410 328 C 362 326, 314 316, 266 302 L 266 240 C 324 252, 370 248, 400 224 Z" fill="#E61073" stroke="#940043" stroke-width="8" />
    <path d="M 276 248 C 324 258, 370 256, 394 238" fill="none" stroke="url(#facet-hl)" stroke-width="6" stroke-linecap="round" />

    <!-- Fila 3: Cuadrantes Inferiores Medios Izquierda -->
    <path d="M 112 342 C 132 376, 168 408, 208 434 L 246 430 L 246 316 C 196 328, 150 338, 112 342 Z" fill="#DE0A6C" stroke="#940043" stroke-width="8" />
    <path d="M 124 350 C 158 344, 202 334, 240 324" fill="none" stroke="url(#facet-hl)" stroke-width="6" stroke-linecap="round" />
    <path d="M 124 354 C 148 382, 178 408, 206 426" fill="none" stroke="url(#facet-hl)" stroke-width="5" stroke-linecap="round" />

    <!-- Fila 3: Cuadrantes Inferiores Medios Derecha -->
    <path d="M 400 342 C 380 376, 344 408, 304 434 L 266 430 L 266 316 C 316 328, 362 338, 400 342 Z" fill="#DE0A6C" stroke="#940043" stroke-width="8" />
    <path d="M 276 324 C 314 334, 358 344, 390 350" fill="none" stroke="url(#facet-hl)" stroke-width="6" stroke-linecap="round" />

    <!-- Fila 4: Punta Inferior del Corazón (Tip facets) -->
    <path d="M 218 444 C 234 456, 246 466, 256 472 L 256 440 L 218 444 Z" fill="#D10664" stroke="#940043" stroke-width="7" />
    <path d="M 294 444 C 278 456, 266 466, 256 472 L 256 440 L 294 444 Z" fill="#D10664" stroke="#940043" stroke-width="7" />
    <path d="M 226 448 L 254 466" stroke="url(#facet-hl)" stroke-width="4.5" stroke-linecap="round" />

    <!-- 4. LÍNEA DIVISORIA CENTRAL VERTICAL -->
    <path d="M 256 182 L 256 472" stroke="#940043" stroke-width="9" stroke-linecap="round" />
    <!-- Resalte de luz vertical -->
    <path d="M 252 196 L 252 452" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />

    <!-- 5. BRILLO GLOSS GENERAL ESTILO STICKER (Lóbulo izquierdo superior) -->
    <path d="M 148 188 
             C 178 172, 214 178, 230 194 
             C 214 204, 184 212, 154 206 
             C 142 202, 138 194, 148 188 Z" 
          fill="#FFFFFF" 
          opacity="0.85" />
    
    <!-- Mini destello en hombro -->
    <ellipse cx="132" cy="236" rx="6" ry="14" transform="rotate(-30 132 236)" fill="#FFFFFF" opacity="0.75" />
  </g>
</svg>
